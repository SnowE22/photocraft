[package]
name = "photocraft-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
egui = { version = "0.36.2", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["sync", "rt"] }
