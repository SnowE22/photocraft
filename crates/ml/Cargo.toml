[package]
name = "photocraft-ml"
description = "Machine-learning models for the Remove tool: LaMa and diffusion inpainting on ONNX Runtime (loaded at run time, DirectML on Windows), and Google's Nano Banana 2.1 over its API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
photocraft-geom = { workspace = true }
photocraft-raster = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Nano Banana's request and answer: the crop as PNG, base64 in JSON (MIT OR Apache-2.0).
photocraft-codecs = { workspace = true }
base64 = "0.22"

# The HTTPS client for Google's API (MIT OR Apache-2.0; rustls with the webpki roots).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "3.5"

# ONNX Runtime (MIT OR Apache-2.0), loaded at run time (`load-dynamic`): nothing links at build
# time, so a build or an install without the runtime works and reports the models as missing.
# Without an `api-*` feature it asks for ONNX Runtime's API 17, which every runtime from 1.17 on
# provides. A release candidate, so pinned exactly.
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["load-dynamic", "directml"] }
# The Google API key in the Windows Credential Manager (MIT OR Apache-2.0).
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

# The Google API key in the macOS Keychain.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(all(not(windows), not(target_arch = "wasm32")))'.dependencies]
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["load-dynamic"] }
